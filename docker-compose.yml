version: "3.9"

services:
  db:
    image: postgres:15
    container_name: omnibook_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 020304
      POSTGRES_DB: omnidb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnidb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnibook_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 020304
      POSTGRES_DB: omnidb
      GROQ_API_KEY: ${GROQ_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-llama-3.3-70b-versatile}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "8000:8000"
    command: >
      bash -lc "
      until pg_isready -h db -p 5433 -U postgres; do
        echo 'Waiting for Postgres...';
        sleep 2;
      done;
      python -c \"import sys; sys.path.insert(0, '.'); from database.pg_db import init_db; init_db()\";
      uvicorn backend.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data:
